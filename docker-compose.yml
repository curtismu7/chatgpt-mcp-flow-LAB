# OrbStack:  HOST_PORT=6650 docker compose up --build -d   ->  http://127.0.0.1:6650/
# The server binds 0.0.0.0 INSIDE the container (MCP_FLOW_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 6650-6699. The container runs as the non-root node user with a
# read-only root filesystem and no capabilities. No host mounts, no docker socket, no host network.
name: chatgpt-mcp-flow-lab

services:
  chatgpt-mcp-flow-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-6650}:6650"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      MCP_FLOW_PORT: "6650"
      MCP_FLOW_BIND: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6650/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
